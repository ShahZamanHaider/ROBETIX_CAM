[platformio]
default_envs = esp32cam

[env:esp32cam]
platform = espressif32@6.11.0
board = esp32cam
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -Wl,--wrap=esp_mbedtls_mem_calloc
lib_deps = bblanchon/ArduinoJson@6.21.5
extra_scripts = pre:tools/embed_ui.py

; Explicit test firmware. The normal esp32cam build retains its production origin.
[env:esp32cam_preview]
extends = env:esp32cam
build_flags =
    ${env:esp32cam.build_flags}
    -DROBETIX_PREVIEW_BUILD=1
extra_scripts =
    ${env:esp32cam.extra_scripts}
    pre:tools/preview_firmware.py